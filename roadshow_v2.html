<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; /* 禁止全局滚动 */
            height: 100vh; /* 确保body高度为视口高度 */
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0c1425 0%, #1a2332 50%, #0f1419 100%);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .ai-message {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        
        .user-message {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .neon-border {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }
        
        .typing-indicator {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .role-card {
            transition: all 0.3s ease;
        }
        
        .role-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15);
        }
        
        .role-card.active {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        
        .scenario-progress {
            background: linear-gradient(90deg, #3b82f6 0%, #10b981 50%, #f59e0b 100%);
        }
        
        .case-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(16, 185, 129, 0.1) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }
        
        .case-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2);
        }
        
        .product-highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(102, 126, 234, 0.3); }
            to { box-shadow: 0 0 30px rgba(118, 75, 162, 0.5); }
        }
        
        .success-story {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #1f2937;
        }
        
        .financing-flow {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #1f2937;
        }
        
        .industry-example {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            color: #1e293b;
            border: 2px solid #6366f1;
        }
        
        .option-button {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            transition: all 0.3s ease;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .option-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        }
        
        .slogan-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .industry-tag {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .industry-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .industry-tag:active {
            transform: translateY(0);
        }
        
        /* Agent相关样式 */
        .agent-central { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        .agent-product { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .agent-case { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .agent-finance { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); }
        .agent-industry { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
        .agent-risk { background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%); }
        
        .agent-mention {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9em;
            margin-right: 8px;
            display: inline-block;
            animation: mentionGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes mentionGlow {
            from { box-shadow: 0 0 5px rgba(59, 130, 246, 0.3); }
            to { box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); }
        }
        
        .coordination-message {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(16, 185, 129, 0.1) 100%);
            border: 1px dashed rgba(59, 130, 246, 0.3);
            font-style: italic;
            opacity: 0.9;
        }
        
        .agent-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .agent-name {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 2px;
        }
        
        .coordination-indicator {
            animation: coordinationPulse 1.5s infinite;
        }

            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>

        const actButtons = document.getElementById('actButtons');
        const actTitle = document.getElementById('actTitle');
        const actDescription = document.getElementById('actDescription');
        const actProgress = document.getElementById('actProgress');

        // 初始化 - 直接从脚本开始，不显示欢迎消息
        document.addEventListener('DOMContentLoaded', function() {
            generateActButtons();
            bindEvents();
            // 直接开始场景1第一幕
            setTimeout(() => {
                loadAct();
            }, 500);
        });

        // 绑定事件
        function bindEvents() {
            // 场景选择
            scenarioSelect.addEventListener('change', function() {
                const scenario = parseInt(this.value);
                switchScenario(scenario);
            });

            // 发送消息
            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            // 重置演示
            document.getElementById('resetDemo').addEventListener('click', resetDemo);
            
            // 导出报告
            document.getElementById('exportData').addEventListener('click', exportReport);
        }

        // 生成戏幕按钮
        function generateActButtons() {
            const scenario = roadshowScripts[`scenario${currentScenario}`];
            actButtons.innerHTML = '';
            
            scenario.acts.forEach((act, index) => {
                const button = document.createElement('button');
                button.className = `act-btn w-full text-left p-3 rounded-lg glass-panel hover:bg-blue-600/20 transition-all ${index === currentAct ? 'bg-blue-600/30 border border-blue-400' : ''}`;
                button.dataset.act = index;
                button.innerHTML = `
                    <p class="font-medium text-sm">${act.title}</p>
                    <p class="text-xs text-gray-300">${act.description}</p>
                `;
                
                button.addEventListener('click', function() {
                    switchAct(parseInt(this.dataset.act));
                });
                
                actButtons.appendChild(button);
            });
        }

        // 切换场景
        function switchScenario(scenario) {
            currentScenario = scenario;
            currentAct = 0;
            currentMessageIndex = 0;
            
            updateScenarioDisplay();
            generateActButtons();
            loadAct();
        }

        // 切换戏幕
        function switchAct(act) {
            currentAct = act;
            currentMessageIndex = 0;
            
            updateActButtons();
            loadAct();
        }
        
        // 更新戏幕按钮状态
        function updateActButtons() {
            document.querySelectorAll('.act-btn').forEach((btn, index) => {
                if (index === currentAct) {
                    btn.className = 'act-btn w-full text-left p-3 rounded-lg glass-panel bg-blue-600/30 border border-blue-400 transition-all';
                } else {
                    btn.className = 'act-btn w-full text-left p-3 rounded-lg glass-panel hover:bg-blue-600/20 transition-all';
                }
            });
        }
        
        // 更新戏幕信息
        function updateActInfo() {
            const scenario = roadshowScripts[`scenario${currentScenario}`];
            const act = scenario.acts[currentAct];
            
            if (act) {
                actTitle.textContent = act.title;
                actDescription.textContent = act.description;
                
                // 更新进度条
                const progress = ((currentAct + 1) / scenario.acts.length) * 100;
                actProgress.style.width = `${progress}%`;
            }
        }

        // 更新场景显示
        function updateScenarioDisplay() {
            const scenarioNames = {
                1: '场景1 - 融资方接触',
                2: '场景2 - 投资伙伴参与', 
                3: '场景3 - MIFC审核'
            };
            
            const scenarioDescriptions = {
                1: '融资方寻找投资伙伴，了解MIFC服务',
                2: '投资伙伴评估项目，生成投资方案',
                3: 'MIFC专业审核，确保投资安全'
            };
            
            currentScenarioText.innerHTML = `
                <div class="font-semibold">${scenarioNames[currentScenario]}</div>
                <div class="text-sm text-gray-400 mt-1">${scenarioDescriptions[currentScenario]}</div>
            `;
            scenarioSelect.value = currentScenario;
        }

        // 加载戏幕
        function loadAct() {
            clearMessages();
            currentMessageIndex = 0;
            waitingForInput = false;
            selectedOption = null;
            
            const scenario = roadshowScripts[`scenario${currentScenario}`];
            const act = scenario.acts[currentAct];
            
            if (act) {
                updateActInfo();
                
                setTimeout(() => {
                    playNextMessage();
                }, 500);
            } else {
                addMessage('ai', '当前戏幕暂无对话内容。');
            }
        }

        // 播放下一条消息 - 支持多Agent协作
        function playNextMessage() {
            const scenario = roadshowScripts[`scenario${currentScenario}`];
            const act = scenario.acts[currentAct];
            
            if (!act || !act.dialogue || currentMessageIndex >= act.dialogue.length) {
                return;
            }

            const message = act.dialogue[currentMessageIndex];
            
            if (message.type === 'ai') {
                addTypingIndicator();
                setTimeout(() => {
                    removeTypingIndicator();
                    addMessage('ai', message.content, message.showOptions, message.options, message.agentType || 'central');
                    currentMessageIndex++;
                    
                    // 如果有选项，等待用户选择
                    if (message.showOptions && message.options) {
                        waitingForInput = true;
                        return;
                    }
                    
                    setTimeout(() => {
                        playNextMessage();
                    }, 2000);
                }, 1500);
            } else if (message.type === 'coordination') {
                // 显示协调消息
                addCoordinationMessage(message.targetAgent, message.task);
                currentMessageIndex++;
                setTimeout(() => {
                    playNextMessage();
                }, 1000);
            } else {
                addMessage('user', message.content);
                currentMessageIndex++;
                setTimeout(() => {
                    playNextMessage();
                }, 1000);
            }
        }

        // 添加消息 - 支持多Agent系统
        function addMessage(type, content, showOptions = false, options = null, agentType = 'central', isCoordination = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex items-start space-x-3';
            
            if (type === 'ai' || agentConfig[type]) {
                const agent = agentConfig[agentType] || agentConfig['central'];
                
                let optionsHtml = '';
                if (showOptions && options) {
                    optionsHtml = `
                        <div class="mt-6 space-y-3">
                            ${options.map((option, index) => `
                                <button onclick="selectOption(${index}, \`${option}\`)" 
                                        class="option-button w-full text-left p-4 rounded-xl font-medium text-white shadow-lg">
                                    <div class="flex items-center">
                                        <span class="text-2xl mr-3">${index === 0 ? '💰' : index === 1 ? '📊' : '🎯'}</span>
                                        <span>${option}</span>
                                    </div>
                                </button>
                            `).join('')}
                        </div>
                    `;
                }
                
                const messageClass = isCoordination ? 'coordination-message' : agent.className;
                const coordinationClass = isCoordination ? 'coordination-indicator' : '';
                
                messageDiv.innerHTML = `
                    <div class="flex flex-col items-center">
                        <div class="agent-avatar ${agent.className}">
                            ${agent.avatar}
                        </div>
                        <div class="agent-name text-center">${agent.displayName}</div>
                    </div>
                    <div class="${messageClass} rounded-lg rounded-tl-none p-3 max-w-lg ${coordinationClass}">
                        <p class="text-white">${content}</p>
                        ${optionsHtml}
                    </div>
                `;
            } else {
                messageDiv.className += ' justify-end';
                messageDiv.innerHTML = `
                    <div class="user-message rounded-lg rounded-tr-none p-3 max-w-md">
                        <p class="text-white">${content}</p>
                    </div>
                    <div class="w-8 h-8 user-message rounded-full flex items-center justify-center">
                        <i class="fas fa-user text-white text-sm"></i>
                    </div>
                `;
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // 添加协调消息
        function addCoordinationMessage(targetAgent, task) {
            const agent = agentConfig[targetAgent];
            if (!agent) return;
            
            const content = `<span class="agent-mention">@${agent.name}</span> ${task}`;
            addMessage('ai', content, false, null, 'central', true);
        }

        // 添加输入指示器
        function addTypingIndicator() {
            if (isTyping) return;
            
            isTyping = true;
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'flex items-start space-x-3';

        // 移除输入指示器
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) {

        // 选择选项 (全局函数)
        window.selectOption = function(index, option) {
            if (!waitingForInput) return;
            
            selectedOption = index;
            addMessage('user', option);
            waitingForInput = false;
            
            // 根据选择的选项播放对应的对话流程
            const optionKey = `option${index + 1}`;
            const flow = scenario1Flows[optionKey];
            
            if (flow && flow.dialogue) {
                playScenario1Flow(flow.dialogue);
            }
        }

            messageInput.value = industry;

            messageInput.value = '';

            handleIndustryInput(industry);

        // 播放场景1的对话流程 - 支持多Agent协作
        function playScenario1Flow(dialogue) {
            let flowIndex = 0;
            
            function playNext() {
                if (flowIndex >= dialogue.length) {
                    // 如果是询问行业的消息，等待用户输入
                    if (dialogue[dialogue.length - 1].content.includes('请描述您的行业')) {
                        waitingForInput = true;
                    }
                    return;
                }
                
                const message = dialogue[flowIndex];
                
                if (message.type === 'ai') {
                    addTypingIndicator();
                    setTimeout(() => {
                        removeTypingIndicator();
                        addMessage('ai', message.content, false, null, message.agentType || 'central');
                        flowIndex++;
                        setTimeout(playNext, 2000);
                    }, 1500);
                } else if (message.type === 'coordination') {
                    addCoordinationMessage(message.targetAgent, message.task);
                    flowIndex++;
                    setTimeout(playNext, 1000);
                } else {
                    addMessage('user', message.content);
                    flowIndex++;
                    setTimeout(playNext, 1000);
                }
            }
            
            setTimeout(playNext, 1000);
        }
        
        // 发送消息
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            addMessage('user', message);
            messageInput.value = '';
            
            // 检查是否在等待行业输入
            if (waitingForInput && selectedOption !== null) {
                handleIndustryInput(message);
                return;
            }
            
            // 场景2特殊处理
            if (currentScenario === 2) {
                handleScenario2Interaction(message);
                return;
            }
            
            // 模拟AI回复
            addTypingIndicator();
            setTimeout(() => {
                removeTypingIndicator();
                const aiResponse = generateAIResponse(message);
                addMessage('ai', aiResponse);
            }, 1500);
        }
        
        // 处理场景2的交互
        function handleScenario2Interaction(message) {
            addTypingIndicator();
            setTimeout(() => {
                removeTypingIndicator();
                
                // 根据用户问题协调不同的Agent回复
                let agentType = 'central';
                let response = '';
                
                if (message.includes('财务') || message.includes('营收') || message.includes('利润')) {
                    agentType = 'finance';
                    addCoordinationMessage('finance', '请为投资伙伴详细分析项目的财务状况和盈利能力');
                    setTimeout(() => {
                        response = generateAIResponse(message);
                        addMessage('ai', response, false, null, agentType);
                    }, 1000);
                } else if (message.includes('风险') || message.includes('安全') || message.includes('保障')) {
                    agentType = 'risk';
                    addCoordinationMessage('risk', '请为投资伙伴进行专业的风险评估和安全保障说明');
                    setTimeout(() => {
                        response = generateAIResponse(message);
                        addMessage('ai', response, false, null, agentType);
                    }, 1000);
                } else if (message.includes('行业') || message.includes('市场') || message.includes('前景')) {
                    agentType = 'industry';
                    addCoordinationMessage('industry', '请为投资伙伴提供专业的行业分析和市场前景评估');
                    setTimeout(() => {
                        response = generateAIResponse(message);
                        addMessage('ai', response, false, null, agentType);
                    }, 1000);
                } else if (message.includes('案例') || message.includes('成功') || message.includes('例子')) {
                    agentType = 'case';
                    addCoordinationMessage('case', '请为投资伙伴展示相关的成功投资案例和经验分享');
                    setTimeout(() => {
                        response = generateAIResponse(message);
                        addMessage('ai', response, false, null, agentType);

        }

        // 处理行业输入
        function handleIndustryInput(industry) {
            userIndustry = industry;
            waitingForInput = false;
            
            // 匹配行业产品
            const matchedProduct = matchIndustryProduct(industry);
            
            addTypingIndicator();
            setTimeout(() => {
                removeTypingIndicator();
                if (matchedProduct) {
                    showIndustryProduct(matchedProduct);
                } else {
                    addMessage('ai', `感谢您提供的信息！虽然"${industry}"不在我们的重点行业列表中，但我们仍然可以为您提供定制化的融资解决方案。让我为您介绍我们的通用融资产品。`);
                }
            }, 1500);
        }
        
        // 匹配行业产品
        function matchIndustryProduct(industry) {
            const industryKeys = Object.keys(industryProducts);
            
            for (let key of industryKeys) {
                if (industry.includes(key) || key.includes(industry)) {
                    return industryProducts[key];
                }
            }
            
            // 模糊匹配
            if (industry.includes('电池') || industry.includes('能源') || industry.includes('光伏') || industry.includes('风力')) {
                return industryProducts['新能源'];
            }
            if (industry.includes('餐饮') || industry.includes('食品') || industry.includes('火锅')) {
                return industryProducts['餐饮'];
            }
            if (industry.includes('房地产') || industry.includes('地产') || industry.includes('建筑')) {
                return industryProducts['房地产'];
            }
            if (industry.includes('零售') || industry.includes('服装') || industry.includes('连锁')) {
                return industryProducts['零售'];
            }
            if (industry.includes('医疗') || industry.includes('健康') || industry.includes('医药') || industry.includes('器械') || industry.includes('制药')) {
                return industryProducts['医疗'];
            }
            if (industry.includes('智能制造') || industry.includes('工业') || industry.includes('机器人') || industry.includes('自动化') || industry.includes('制造')) {
                return industryProducts['智能制造'];
            }
            if (industry.includes('数字经济') || industry.includes('互联网') || industry.includes('电商') || industry.includes('移动应用') || industry.includes('平台') || industry.includes('数字营销')) {
                return industryProducts['数字经济'];
            }
            
            return null;
        }

            let responseDb = currentScenario === 2 ? scenario2Responses : generalResponses;

            if (currentScenario === 2) {

        // 清空消息
        function clearMessages() {
            messagesContainer.innerHTML = '';
        }

        // 重置演示
        function resetDemo() {
            currentScenario = 1;
            currentAct = 0;
            currentMessageIndex = 0;
            
            updateScenarioDisplay();
            generateActButtons();
            loadAct();
        }

        // 导出报告
        function exportReport() {
            const reportData = {
                timestamp: new Date().toISOString(),
                scenario: currentScenario,
                act: currentAct,
                actTitle: actTitle.textContent,
                messages: Array.from(messagesContainer.children).map(msg => msg.textContent)
            };
            
            const blob = new Blob([JSON.stringify(reportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `MIFC路演报告_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
