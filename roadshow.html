<!DOCTYPE html>

        body { font-family: 'Inter', sans-serif; }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0c1425 0%, #1a2332 50%, #0f1419 100%);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .ai-message {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        
        .user-message {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .neon-border {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }
        
        .typing-indicator {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .role-card {
            transition: all 0.3s ease;
        }
        
        .role-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15);
        }
        
        .role-card.active {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

            background: linear-gradient(90deg, #3b82f6 0%, #10b981 50%, #f59e0b 100%);

            });

            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            // 重置演示
            document.getElementById('resetDemo').addEventListener('click', resetDemo);

            document.getElementById('exportData').addEventListener('click', exportReport);

        // 生成戏幕按钮
        function generateActButtons() {
            const scenario = roadshowScripts[`scenario${currentScenario}`];
            actButtons.innerHTML = '';
            
            scenario.acts.forEach((act, index) => {
                const button = document.createElement('button');
                button.className = `act-btn w-full text-left p-3 rounded-lg glass-panel hover:bg-blue-600/20 transition-all ${index === currentAct ? 'bg-blue-600/30 border border-blue-400' : ''}`;
                button.dataset.act = index;
                button.innerHTML = `
                    <p class="font-medium text-sm">${act.title}</p>
                    <p class="text-xs text-gray-300">${act.description}</p>
                `;
                
                button.addEventListener('click', function() {
                    switchAct(parseInt(this.dataset.act));
                });
                
                actButtons.appendChild(button);
            });
        }

        // 切换场景
        function switchScenario(scenario) {
            currentScenario = scenario;
            currentAct = 0;
            currentMessageIndex = 0;
            
            updateScenarioDisplay();
            generateActButtons();
            loadAct();
        }

        // 切换戏幕
        function switchAct(act) {
            currentAct = act;
            currentMessageIndex = 0;
            
            // 更新按钮状态
            document.querySelectorAll('.act-btn').forEach((btn, index) => {
                if (index === act) {
                    btn.className = 'act-btn w-full text-left p-3 rounded-lg glass-panel bg-blue-600/30 border border-blue-400 transition-all';
                } else {
                    btn.className = 'act-btn w-full text-left p-3 rounded-lg glass-panel hover:bg-blue-600/20 transition-all';
                }
            });
            
            loadAct();
        }

        // 更新场景显示
        function updateScenarioDisplay() {
            const scenarioNames = {
                1: '场景1 - 融资方接触',
                2: '场景2 - 投资伙伴参与', 
                3: '场景3 - MIFC审核'
            };
            currentScenarioText.textContent = `当前：${scenarioNames[currentScenario]}`;
            scenarioSelect.value = currentScenario;
        }

        // 加载戏幕
        function loadAct() {
            clearMessages();
            currentMessageIndex = 0;
            
            const scenario = roadshowScripts[`scenario${currentScenario}`];
            const act = scenario.acts[currentAct];
            
            if (act) {
                // 更新戏幕信息
                actTitle.textContent = act.title;
                actDescription.textContent = act.description;
                
                // 更新进度条
                const progress = ((currentAct + 1) / scenario.acts.length) * 100;
                actProgress.style.width = `${progress}%`;
                
                setTimeout(() => {
                    playNextMessage();
                }, 500);
            } else {
                addMessage('ai', '当前戏幕暂无对话内容。');
            }
        }

        // 播放下一条消息
        function playNextMessage() {
            const scenario = roadshowScripts[`scenario${currentScenario}`];
            const act = scenario.acts[currentAct];
            
            if (!act || !act.dialogue || currentMessageIndex >= act.dialogue.length) {
                return;
            }

            const message = act.dialogue[currentMessageIndex];
            
            if (message.type === 'ai') {
                addTypingIndicator();
                setTimeout(() => {

                    addMessage('ai', message.content);
                    currentMessageIndex++;
                    setTimeout(() => {
                        playNextMessage();

            } else {

                currentMessageIndex++;
                setTimeout(() => {
                    playNextMessage();
                }, 1000);
            }

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // 移除输入指示器
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
            isTyping = false;
        }

        // 发送消息
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            addMessage('user', message);
            messageInput.value = '';
            
            // 模拟AI回复
            addTypingIndicator();
            setTimeout(() => {
                removeTypingIndicator();
                const aiResponse = generateAIResponse(message);
                addMessage('ai', aiResponse);
            }, 1500);
        }

        // 生成AI回复
        function generateAIResponse(userMessage) {
            const responses = {
                '收入分成': '收入分成模式是我们的核心创新，投资方可以获得企业未来收入的固定比例分成，风险更低，回报更稳定。',
                'MIFC': 'MIFC是香港注册的专业投资基金联盟，管理资金超过500亿港币，专注于成长型企业投资。',
                '滴灌通': '滴灌通是完整的投资生态平台，连接融资方、投资伙伴和MIFC，提供全流程投资服务。',
                '风险': '我们采用严格的风控体系，包括财务审核、技术评估、市场分析等多维度评估，确保投资安全。'
            };
            
            for (let key in responses) {
                if (userMessage.includes(key)) {
                    return responses[key];
                }
            }
            
            return '感谢您的提问！我会根据您的具体需求提供详细解答。您还想了解哪方面的信息？';
        }

        // 清空消息
        function clearMessages() {
            messagesContainer.innerHTML = '';
        }

        // 重置演示
        function resetDemo() {
            currentScenario = 1;
            currentAct = 0;
            currentMessageIndex = 0;
            
            updateScenarioDisplay();
            generateActButtons();
            loadAct();
        }

        // 导出报告
        function exportReport() {
            const reportData = {
                timestamp: new Date().toISOString(),
                scenario: currentScenario,
                act: currentAct,
                actTitle: actTitle.textContent,
                messages: Array.from(messagesContainer.children).map(msg => msg.textContent)
            };
            
            const blob = new Blob([JSON.stringify(reportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `MIFC路演报告_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
